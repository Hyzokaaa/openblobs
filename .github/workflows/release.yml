name: Release

# Every push to main: if the commits since the last tag hold a feat, fix, perf or breaking change,
# bump the version, publish to npm, and push the release commit and tag to GitHub only.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # trusted publishing and provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # npm 11.5 or later publishes through npm's trusted publishing (OIDC), with no token
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - id: version
        run: node scripts/release.mjs

      # prepublishOnly runs the typecheck, the tests and the build first.
      # npm trusts this workflow (package settings, Trusted Publisher), so no token is needed.
      - if: steps.version.outputs.version
        run: npm publish --provenance --access public

      - if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
